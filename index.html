<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YtakezStore — игры и приложения</title>
<meta name="description" content="YtakezStore: все мои игры и приложения в одном месте.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,600;8..144,800;8..144,1000&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4A4FC4;--on-primary:#fff;
  --primary-c:#E1E0FF;--on-primary-c:#0A0B6B;
  --secondary-c:#D8EDC0;--on-secondary-c:#10200A;
  --tertiary-c:#FFD9E3;--on-tertiary-c:#3E001D;
  --surface:#FCF8FF;--surface-c:#F0ECF6;--surface-ch:#EAE6F0;
  --on-surface:#1B1B21;--on-surface-v:#47464F;--outline:#78767F;
  --r-xl:28px;--r-xxl:40px;
  --ease:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root{
  --primary:#BFC2FF;--on-primary:#1B1C8C;
  --primary-c:#33359F;--on-primary-c:#E1E0FF;
  --secondary-c:#2C4B1E;--on-secondary-c:#D8EDC0;
  --tertiary-c:#6A1F3F;--on-tertiary-c:#FFD9E3;
  --surface:#131318;--surface-c:#1F1F25;--surface-ch:#2A292F;
  --on-surface:#E4E1E9;--on-surface-v:#C8C5D0;--outline:#928F99;
}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Roboto Flex",system-ui,sans-serif;background:var(--surface);color:var(--on-surface);line-height:1.5;min-height:100vh;padding-bottom:96px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

/* top bar */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.mark{width:40px;height:40px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:1000;border-radius:14px 22px 14px 22px}
.spacer{flex:1}
.gh{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:20px;background:var(--surface-ch);font-weight:600;font-size:.9rem;transition:border-radius .3s var(--ease),background .2s}
.gh:hover{border-radius:12px;background:var(--primary-c)}

/* hero */
.hero{max-width:1100px;margin:16px auto 0;padding:0 20px}
.hero-box{position:relative;overflow:hidden;background:var(--primary-c);color:var(--on-primary-c);border-radius:var(--r-xxl) 96px var(--r-xxl) var(--r-xxl);padding:clamp(28px,6vw,64px)}
.hero h1{font-size:clamp(2.6rem,10vw,6.5rem);line-height:.95;font-weight:1000;letter-spacing:-.04em;font-variation-settings:"opsz" 144;max-width:9ch}
.hero p{margin-top:20px;font-size:1.15rem;max-width:34ch}
.blob{position:absolute;right:-40px;bottom:-40px;width:min(52vw,360px);aspect-ratio:1;background:var(--tertiary-c);border-radius:58% 42% 38% 62%/49% 55% 45% 51%;animation:morph 9s ease-in-out infinite alternate}
.blob.b2{right:12%;bottom:auto;top:-70px;width:min(26vw,170px);background:var(--secondary-c);animation-duration:7s}
@keyframes morph{
  0%{border-radius:58% 42% 38% 62%/49% 55% 45% 51%;transform:rotate(0)}
  100%{border-radius:30% 70% 62% 38%/60% 38% 62% 40%;transform:rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}

/* controls */
main{max-width:1100px;margin:0 auto;padding:32px 20px}
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;background:var(--surface-ch);border-radius:28px}
.search input{flex:1;border:0;background:none;font:inherit;color:inherit;outline:0}
.search:focus-within{box-shadow:0 0 0 3px var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 28px}
.chip{border:1px solid var(--outline);background:none;color:var(--on-surface-v);font:inherit;font-weight:600;height:40px;padding:0 20px;border-radius:20px;cursor:pointer;transition:border-radius .3s var(--ease),background .2s}
.chip:hover{border-radius:12px}
.chip[aria-pressed=true]{background:var(--secondary-c);color:var(--on-secondary-c);border-color:transparent}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--surface-c);border-radius:var(--r-xl);transition:border-radius .35s var(--ease),transform .35s var(--ease),background .2s}
.card:hover{border-radius:48px 20px 48px 20px;transform:translateY(-4px);background:var(--surface-ch)}
.card:nth-child(3n+1) .icon{background:var(--primary-c);color:var(--on-primary-c);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.card:nth-child(3n+2) .icon{background:var(--tertiary-c);color:var(--on-tertiary-c);border-radius:30%}
.card:nth-child(3n) .icon{background:var(--secondary-c);color:var(--on-secondary-c);border-radius:50%}
.icon{overflow:hidden;width:64px;height:64px;display:grid;place-items:center;font-size:2rem;transition:transform .4s var(--ease)}
.icon img{width:100%;height:100%;object-fit:cover}
.card:hover .icon{transform:rotate(-8deg) scale(1.08)}
.card h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.card p{color:var(--on-surface-v);flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:12px;background:var(--surface);color:var(--on-surface-v)}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:20px;font-weight:600;font-size:.9rem;transition:border-radius .3s var(--ease)}
.btn:hover{border-radius:12px}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--surface-ch);color:var(--on-surface)}
.empty{padding:48px 0;text-align:center;color:var(--on-surface-v)}
.empty b{display:block;font-size:1.4rem;color:var(--on-surface);margin-bottom:6px}

/* nav bar + fab */
nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:var(--surface-ch);border-radius:32px;box-shadow:0 4px 16px rgb(0 0 0/.18)}
nav a{height:48px;padding:0 20px;display:grid;place-items:center;border-radius:24px;font-weight:600;font-size:.9rem;color:var(--on-surface-v);transition:border-radius .3s var(--ease),background .2s}
nav a:hover{background:var(--primary-c);color:var(--on-primary-c);border-radius:14px}
footer{max-width:1100px;margin:24px auto 0;padding:0 20px;color:var(--on-surface-v);font-size:.9rem}
</style>
</head>
<body>

<header>
  <a class="logo" href="#top"><span class="mark">Y</span>YtakezStore</a>
  <span class="spacer"></span>
  <!-- ЗАМЕНИ ytakez на свой ник на GitHub -->
  <a class="gh" href="https://github.com/ytakez" target="_blank" rel="noopener">GitHub</a>
</header>

<section class="hero" id="top">
  <div class="hero-box">
    <h1>Ytakez Store</h1>
    <p>Мои игры и приложения для Android. Выбирай и скачивай APK прямо здесь.</p>
    <span class="blob b2" aria-hidden="true"></span>
    <span class="blob" aria-hidden="true"></span>
  </div>
</section>

<main id="catalog">
  <label class="search">
    <span aria-hidden="true">🔎</span>
    <input id="q" type="search" placeholder="Найти игру или приложение" aria-label="Поиск">
  </label>
  <div class="chips" id="chips" role="group" aria-label="Категория">
    <button class="chip" data-f="all" aria-pressed="true">Все</button>
    <button class="chip" data-f="game" aria-pressed="false">Игры</button>
    <button class="chip" data-f="app" aria-pressed="false">Приложения</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><b>Ничего не нашлось</b>Попробуй другой запрос или категорию.</div>
</main>

<footer>© <span id="y"></span> YtakezStore</footer>

<nav aria-label="Разделы">
  <a href="#top">Главная</a>
  <a href="#catalog">Каталог</a>
</nav>

<script>
/* ===== ТВОИ ПРОЕКТЫ: редактируй только этот список =====
   type: "game" | "app"     file: имя APK-файла, лежащего рядом с index.html
   icon: эмодзи             img: путь к картинке-иконке (необязательно)
   link: внешняя ссылка вместо file (Releases и т.д.)             */
const items = [
  {name:"ДВС-Симулятор", type:"game", icon:"🏎️", img:"dvs.png", desc:"Симулятор двигателя внутреннего сгорания: заводи, управляй и смотри, как всё работает.", tags:["Android","Симулятор"], file:"DVS-Simulator.apk", version:"", size:"0,9 МБ", repo:""},
  {name:"YouPlayer", type:"app", icon:"🎵", img:"youplayer.png", desc:"Музыкальный плеер в стиле Material You.", tags:["Android","Музыка"], file:"YouPlayer-1.2.apk", version:"1.2", size:"19 МБ", repo:""},
  {name:"YouJcam", type:"app", icon:"📷", desc:"Камера в стиле Material You.", tags:["Android","Камера"], file:"YouJcam-1.1.apk", version:"1.1", size:"4,5 МБ", repo:""}
];

const grid=document.getElementById('grid'), empty=document.getElementById('empty'),
      q=document.getElementById('q'), chips=document.getElementById('chips');
let filter='all';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const t=q.value.trim().toLowerCase();
  const list=items.filter(i=>(filter==='all'||i.type===filter)&&
    (i.name+' '+i.desc+' '+i.tags.join(' ')).toLowerCase().includes(t));
  grid.innerHTML=list.map(i=>`
    <article class="card">
      <div class="icon" aria-hidden="true">${i.img?`<img src="${esc(i.img)}" alt="">`:esc(i.icon)}</div>
      <h2>${esc(i.name)}</h2>
      <p>${esc(i.desc)}</p>
      <div class="meta"><span class="tag">${i.type==='game'?'Игра':'Приложение'}</span>${i.version?`<span class="tag">v${esc(i.version)}</span>`:''}${i.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      <div class="actions">
        ${i.file?`<a class="btn fill" href="${esc(i.file)}" download>Скачать${i.size?' · '+esc(i.size):''}</a>`
                :`<a class="btn fill" href="${esc(i.link||'#')}" target="_blank" rel="noopener">Открыть</a>`}
        ${i.repo?`<a class="btn tonal" href="${esc(i.repo)}" target="_blank" rel="noopener">Код</a>`:''}
      </div>
    </article>`).join('');
  empty.hidden=list.length>0;
}
q.addEventListener('input',render);
chips.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.f;
  chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
  render();
});
document.getElementById('y').textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
